<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eudi｜产品与产品运营实习作品集</title><meta name="description" content="Eudi 的产品、产品运营、创业与设计作品集。通过四只盲盒探索真实经历与作品。"><style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#5b5755;font-family:Georgia,'Noto Serif SC',serif}.page{max-width:520px;min-height:100vh;margin:auto;background:#fcfaf7 url('concept.png') center top/100% 100% no-repeat;position:relative}.role{position:absolute;top:10.5%;left:0;width:100%;text-align:center;color:#8b8583;font:12px Georgia,serif;letter-spacing:.08em}.top{position:absolute;top:3%;left:7%;right:5%;display:flex;justify-content:space-between;align-items:center}.exit{background:#ffffffa8;border:1px solid #e5e0dc;border-radius:100%;width:44px;height:44px;font-size:22px;color:#444;cursor:pointer}.pill{display:flex;border:1px solid #dedbd8;border-radius:30px;background:#ffffffc9;padding:8px 12px;gap:12px;font:20px Arial;color:#222}.pill span+span{border-left:1px solid #bbb;padding-left:12px}.gift{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:24px;width:34%;height:17%;transition:transform .25s}.gift:hover,.gift:focus-visible{transform:scale(1.06);outline:2px solid #b8c9d6}.gift.opened:after{content:'✦';position:absolute;top:0;right:0;color:#8ba4b5;font-size:27px}.gift .revealed{display:none;position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf9e8;border:1px solid #e6e0d8;border-radius:20px;padding:5px 11px;font-size:12px;color:#697e89}.gift.opened .revealed{display:block}.gift:nth-of-type(1){top:30%;left:13%}.gift:nth-of-type(2){top:43%;left:51%}.gift:nth-of-type(3){top:57%;left:6%}.gift:nth-of-type(4){top:70%;left:49%}.sheet{position:fixed;inset:0;background:#f8f6f2e8;display:grid;place-items:center;padding:24px;z-index:2}.card{width:min(420px,100%);background:#fffcf7;border:1px solid #e8e0d3;box-shadow:0 18px 60px #8885;border-radius:22px;padding:42px 28px;text-align:center}.card .bow{font-size:48px;color:#aabed1}.card h2{font-size:25px;font-weight:400}.card p{line-height:1.8}.card button{border:1px solid #bfd1da;background:#edf3f5;padding:12px 22px;border-radius:30px;color:#4c626f;margin:5px;cursor:pointer}.card button.secondary{background:transparent}.hidden{display:none}@media(max-width:520px){.page{min-height:177.5vw}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><main class="page"><div class="role">Eudi · 产品 / 产品运营实习作品集</div><div class="top"><button class="exit" aria-label="退出" onclick="exitSite()">⇥</button><div class="pill" aria-label="小程序样式控件"><span>•••</span><span>━</span><span>◎</span></div></div><button class="gift" aria-label="拆开盲盒一"></button><button class="gift" aria-label="拆开盲盒二"></button><button class="gift" aria-label="拆开盲盒三"></button><button class="gift" aria-label="拆开盲盒四"></button></main><div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="card"><div class="bow">୨୧</div><h2 id="title"></h2><p id="desc"></p><button id="enter">进入看看 →</button><button class="secondary" id="close">继续拆盒</button></div></div><script>const topics=[{title:'关于 Eudi',desc:'一些想法、好奇心与正在生长的产品思考。'},{title:'创业作品',desc:'从一个想法到真正落地，看看 Eudi 做过的事。'},{title:'实习与校园',desc:'在社区产品、项目与团队里积累的实践。'},{title:'设计作品',desc:'用视觉记录想法，也记录看世界的方式。'}];const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const assignment=(()=>{try{let v=JSON.parse(sessionStorage.getItem("eudiAssignment"));if(Array.isArray(v)&&v.length===4&&new Set(v).size===4)return v}catch(e){}let v=shuffle([...topics.keys()]);sessionStorage.setItem("eudiAssignment",JSON.stringify(v));return v})();let current=-1;const gifts=[...document.querySelectorAll('.gift')];gifts.forEach((b,i)=>{let label=document.createElement('span');label.className='revealed';label.textContent='已开启 · '+topics[assignment[i]].title;b.appendChild(label)});try{JSON.parse(sessionStorage.getItem('eudiOpened')||'[]').forEach(i=>gifts[i]?.classList.add('opened'))}catch(e){}const sheet=document.getElementById('sheet');gifts.forEach((b,i)=>b.onclick=()=>{current=i;b.classList.add('opened');sessionStorage.setItem('eudiOpened',JSON.stringify([...new Set([...(JSON.parse(sessionStorage.getItem('eudiOpened')||'[]')),i])]));document.getElementById('title').textContent=topics[assignment[i]].title;document.getElementById('desc').textContent=topics[assignment[i]].desc;sheet.classList.remove('hidden')});document.getElementById('close').onclick=()=>sheet.classList.add('hidden');document.getElementById('enter').onclick=()=>{sheet.classList.add('hidden');assignment[current]===0?location.href='about.html':assignment[current]===1?location.href='ventures.html':assignment[current]===2?location.href='dewu.html':location.href='design.html'};const pending=sessionStorage.getItem('eudiContinue');if(pending==='1'){sessionStorage.removeItem('eudiContinue');let unopened=gifts.map((_,i)=>i).filter(i=>!gifts[i].classList.contains('opened'));if(unopened.length)setTimeout(()=>gifts[unopened[0]].click(),120)}function exitSite(){if(history.length>1)history.back();else window.location.href='about:blank'}</script></body></html>
